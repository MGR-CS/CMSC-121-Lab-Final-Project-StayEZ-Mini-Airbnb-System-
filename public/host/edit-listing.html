<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEZ — Edit Listing</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="navbar">
    <a class="brand" href="/host/my-listings.html">🏠 StayEZ</a>
    <nav>
        <a href="/host/my-listings.html">My Listings</a>
        <a href="/host/create-listing.html">+ New Listing</a>
        <a href="/host/booking-requests.html">Booking Requests</a>
        <a href="#" id="logout-btn">Logout</a>
    </nav>
</header>

<main class="container">
    <h1>Edit Listing</h1>
    <p id="error-msg" class="msg-error"></p>

    <form id="edit-form" style="display: none; flex-direction: column; gap: 1rem;">
        <label>
            Listing Name:
            <input type="text" id="name" required />
        </label>

        <label>
            Type (e.g., Apartment, Villa):
            <input type="text" id="type" required />
        </label>

        <label>
            Location:
            <input type="text" id="location" required />
        </label>

        <label>
            Price per night (₱):
            <input type="number" id="price" required />
        </label>

        <label>
            Contact Number:
            <input type="text" id="contactNumber" required />
        </label>

        <label>
            Image URL:
            <input type="text" id="image" />
        </label>

        <label>
            Description:
            <textarea id="description" rows="4" required></textarea>
        </label>

        <div style="display:flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/host/my-listings.html'">Cancel</button>
        </div>
    </form>
</main>

<script src="/js/api.js"></script>
<script>
    requireAuth("host");
    document.getElementById("logout-btn").addEventListener("click", logout);

    // 1. Get the ID from the URL parameters (e.g., ?id=12345)
    const urlParams = new URLSearchParams(window.location.search);
    const listingId = urlParams.get("id");

    const form = document.getElementById("edit-form");
    const errorMsg = document.getElementById("error-msg");

    // 2. Fetch the listing data and pre-fill the form
    async function loadListingData() {
        if (!listingId) {
            errorMsg.textContent = "Invalid listing ID.";
            return;
        }
        try {
            const listing = await apiFetch(`/listings/${listingId}`);

            // Pre-fill fields
            document.getElementById("name").value = listing.name || "";
            document.getElementById("type").value = listing.type || "";
            document.getElementById("location").value = listing.location || "";
            document.getElementById("price").value = listing.price || "";
            document.getElementById("contactNumber").value = listing.contactNumber || "";
            document.getElementById("image").value = listing.image || "";
            document.getElementById("description").value = listing.description || "";

            // Show the form now that data is loaded
            form.style.display = "flex";
        } catch (err) {
            errorMsg.textContent = "Error loading listing: " + err.message;
        }
    }

    // 3. Handle the form submission (PUT request)
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const updatedData = {
            name: document.getElementById("name").value,
            type: document.getElementById("type").value,
            location: document.getElementById("location").value,
            price: Number(document.getElementById("price").value),
            contactNumber: document.getElementById("contactNumber").value,
            image: document.getElementById("image").value,
            description: document.getElementById("description").value,
        };

        try {
            await apiFetch(`/listings/${listingId}`, {
                method: "PUT",
                body: updatedData // Your apiFetch likely stringifies this automatically
            });

            alert("Listing updated successfully!");
            window.location.href = "/host/my-listings.html"; // Send them back
        } catch (err) {
            errorMsg.textContent = "Failed to update: " + err.message;
        }
    });

    // Run on page load
    loadListingData();
</script>
</body>
</html>
