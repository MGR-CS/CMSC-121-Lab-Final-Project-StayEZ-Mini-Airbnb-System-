<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayEZ — Create Listing</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/host/my-listings.html">🏠 StayEZ</a>
    <nav>
      <a href="/host/my-listings.html">My Listings</a>
      <a href="/host/create-listing.html">+ New Listing</a>
      <a href="/host/booking-requests.html">Booking Requests</a>
      <a href="#" id="logout-btn">Logout</a>
    </nav>
  </header>

  <main class="container">
    <h1>Create a New Listing</h1>
    <div class="card" style="max-width:600px;">
      <form id="create-listing-form">
        <div class="form-group">
          <label for="name">Listing Name</label>
          <input id="name" type="text" required placeholder="e.g. Cozy Studio in Malate" />
        </div>
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type">
            <option value="hotel">Hotel</option>
            <option value="apartment">Apartment</option>
            <option value="dorm">Dorm</option>
            <option value="guest_room">Guest Room</option>
          </select>
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input id="location" type="text" required placeholder="e.g. Manila" />
        </div>
        <div class="form-group">
          <label for="price">Price per Night (₱)</label>
          <input id="price" type="number" min="0" required />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="Describe your property..."></textarea>
        </div>
        <div class="form-group">
          <label for="image">Image URL</label>
          <input id="image" type="url" placeholder="https://..." />
          <!-- TODO: (Optional) Replace with file upload input using multer -->
        </div>
        <div class="form-group">
          <label for="contact">Contact Number</label>
          <input id="contact" type="text" required placeholder="+63 9XX XXX XXXX" />
        </div>
        <button type="submit" class="btn btn-primary">Create Listing</button>
        <p id="form-error"   class="msg-error"   hidden></p>
        <p id="form-success" class="msg-success" hidden></p>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    requireAuth("host");
    document.getElementById("logout-btn").addEventListener("click", logout);

    document.getElementById("create-listing-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl   = document.getElementById("form-error");
      const successEl = document.getElementById("form-success");
      errorEl.hidden = successEl.hidden = true;

      const body = {
        name:          document.getElementById("name").value,
        type:          document.getElementById("type").value,
        location:      document.getElementById("location").value,
        price:         Number(document.getElementById("price").value),
        description:   document.getElementById("description").value,
        image:         document.getElementById("image").value,
        contactNumber: document.getElementById("contact").value,
      };

      try {
        // TODO: Call POST /api/listings
        await apiFetch("/listings", { method: "POST", body });
        successEl.textContent = "Listing created successfully!";
        successEl.hidden = false;
        e.target.reset();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
