<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Properties | StayEZ</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-50">

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>

<div class="page-content container-lg">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;flex-wrap:wrap;gap:16px;">
    <div>
      <h1 style="font-size:32px;font-weight:800;color:var(--gray-900);margin:0 0 8px;font-family:'DM Serif Display',serif;">My Properties</h1>
      <p style="color:var(--gray-500);font-size:15px;margin:0;">Manage your listings and see performance stats</p>
    </div>
    <button onclick="openListingModal()" class="btn btn-primary" style="height:44px;"><i class="fas fa-plus"></i> Add New Listing</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-bottom:32px;">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">Total Properties</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-active" style="color:var(--success);">0</div>
      <div class="stat-label">Active Bookings</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-revenue" style="color:var(--gray-900);">$0</div>
      <div class="stat-label">Est. Revenue</div>
    </div>
  </div>

  <div id="host-listings-grid" class="listing-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;">
    <!-- Skeletons -->
    <div class="listing-card skeleton" style="height:340px;"></div>
    <div class="listing-card skeleton" style="height:340px;"></div>
  </div>
</div>

<!-- Listing Form Modal -->
<div id="listing-modal" class="modal-overlay" onclick="if(event.target===this) closeListingModal()">
  <div class="modal-content" style="width:100%;max-width:600px;padding:32px;position:relative;">
    <button onclick="closeListingModal()" style="position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--gray-100);border:none;cursor:pointer;"><i class="fas fa-times"></i></button>
    <h2 id="listing-modal-title" style="font-size:24px;font-weight:800;margin:0 0 24px;">Add New Listing</h2>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      <div style="grid-column:1/-1;">
        <label style="font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;margin-bottom:6px;display:block;">Property Name</label>
        <input type="text" id="form-name" placeholder="e.g. Sunny Beachfront Villa"/>
      </div>
      <div>
        <label style="font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;margin-bottom:6px;display:block;">Property Type</label>
        <select id="form-type">
          <option value="apartment">Apartment</option>
          <option value="house">House</option>
          <option value="villa">Villa</option>
          <option value="condo">Condo</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;margin-bottom:6px;display:block;">Price per Night ($)</label>
        <input type="number" id="form-price" min="1"/>
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;margin-bottom:6px;display:block;">Location</label>
        <input type="text" id="form-loc" placeholder="e.g. Boracay, Aklan"/>
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;margin-bottom:6px;display:block;">Contact Number</label>
        <input type="text" id="form-contact" placeholder="+63 900 000 0000"/>
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;margin-bottom:6px;display:block;">Image URL</label>
        <input type="url" id="form-img" placeholder="https://..."/>
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;margin-bottom:6px;display:block;">Description</label>
        <textarea id="form-desc" rows="3" placeholder="Tell guests about your place..."></textarea>
      </div>
    </div>
    
    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px;">
      <button onclick="closeListingModal()" class="btn btn-secondary">Cancel</button>
      <button id="save-listing-btn" onclick="saveListing()" class="btn btn-primary" style="min-width:120px;">Save Listing</button>
    </div>
  </div>
</div>

<script>
  requireAuth('host');
  renderHeader('my-listings');

  let myListings = [];
  let editingListingId = null;

  async function loadHostListings() {
    const grid = document.getElementById('host-listings-grid');
    grid.innerHTML = '<div class="listing-card skeleton" style="height:340px;"></div>'.repeat(3);

    try {
      myListings = await apiGetMyListings();
    } catch (e) {
      console.warn("API failed, falling back to mock data", e);
      const all = JSON.parse(localStorage.getItem('stayez_listings') || '[]');
      myListings = all.filter(l => String(l.hostId._id || l.hostId) === String(getUser()._id));
    }

    // Load stats from bookings
    let allHostBookings = [];
    try {
      allHostBookings = await apiGetHostBookings();
    } catch (e) {
      const allBooks = JSON.parse(localStorage.getItem('stayez_bookings') || '[]');
      const myListingIds = myListings.map(l => l._id);
      allHostBookings = allBooks.filter(b => myListingIds.includes(b.listingId));
    }

    const activeBooks = allHostBookings.filter(b => b.status === 'approved');
    const estRev = activeBooks.reduce((sum, b) => sum + (b.totalPrice || 0), 0);

    document.getElementById('stat-total').textContent = myListings.length;
    document.getElementById('stat-active').textContent = activeBooks.length;
    document.getElementById('stat-revenue').textContent = '$' + estRev.toLocaleString();

    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('host-listings-grid');
    if (myListings.length === 0) {
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 20px;background:white;border-radius:16px;border:1px dashed var(--gray-300);">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--gray-50);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
            <i class="fas fa-home" style="font-size:24px;color:var(--gray-400);"></i>
          </div>
          <h3 style="font-size:18px;font-weight:700;color:var(--gray-900);margin-bottom:8px;">No listings yet</h3>
          <p style="color:var(--gray-500);font-size:14px;margin-bottom:24px;">Add your first property to start receiving bookings.</p>
          <button onclick="openListingModal()" class="btn btn-primary"><i class="fas fa-plus"></i> Add Listing</button>
        </div>`;
      return;
    }

    grid.innerHTML = myListings.map(listing => `
      <div class="listing-card">
        <div class="listing-image" style="height:180px;">
          <img src="${listing.image}" onerror="this.onerror=null; this.src='https://via.placeholder.com/500x300';"/>
        </div>
        <div style="padding:20px;display:flex;flex-direction:column;flex:1;">
          <div style="display:inline-block;padding:2px 8px;background:var(--brand-light);color:var(--brand-dark);border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:8px;align-self:flex-start;">${listing.type}</div>
          <h3 style="font-size:16px;font-weight:700;color:var(--gray-900);margin:0 0 4px;">${listing.name}</h3>
          <p style="font-size:13px;color:var(--gray-500);margin:0 0 16px;"><i class="fas fa-map-marker-alt" style="margin-right:4px;"></i>${listing.location}</p>
          
          <div style="margin-top:auto;display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--gray-100);">
            <button onclick="openListingModal('${listing._id}')" class="btn btn-secondary btn-sm" style="flex:1;"><i class="fas fa-edit"></i> Edit</button>
            <button onclick="deleteListing('${listing._id}')" class="btn btn-sm" style="background:#FEE2E2;color:#DC2626;flex:1;"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
        </div>
      </div>`).join('');
  }

  function openListingModal(id = null) {
    editingListingId = id;
    if (id) {
      const listing = myListings.find(l => l._id === id);
      document.getElementById('listing-modal-title').textContent = 'Edit Listing';
      document.getElementById('form-name').value = listing.name;
      document.getElementById('form-type').value = listing.type;
      document.getElementById('form-price').value = listing.price;
      document.getElementById('form-loc').value = listing.location;
      document.getElementById('form-contact').value = listing.contactNumber || '';
      document.getElementById('form-img').value = listing.image;
      document.getElementById('form-desc').value = listing.description;
    } else {
      document.getElementById('listing-modal-title').textContent = 'Add New Listing';
      ['form-name','form-price','form-loc','form-contact','form-img','form-desc'].forEach(i => document.getElementById(i).value = '');
      document.getElementById('form-type').value = 'apartment';
    }
    document.getElementById('listing-modal').classList.add('open');
  }

  function closeListingModal() {
    document.getElementById('listing-modal').classList.remove('open');
    editingListingId = null;
  }

  async function saveListing() {
    const data = {
      name: document.getElementById('form-name').value.trim(),
      type: document.getElementById('form-type').value,
      price: Number(document.getElementById('form-price').value),
      location: document.getElementById('form-loc').value.trim(),
      contactNumber: document.getElementById('form-contact').value.trim(),
      image: document.getElementById('form-img').value.trim(),
      description: document.getElementById('form-desc').value.trim()
    };

    if (!data.name || !data.price || !data.location || !data.contactNumber) {
      return showToast('Please fill all required fields', 'warning');
    }

    const btn = document.getElementById('save-listing-btn');
    btn.disabled = true;

    try {
      if (editingListingId) {
        await apiUpdateListing(editingListingId, data);
        showToast('Listing updated successfully!', 'success');
      } else {
        await apiCreateListing(data);
        showToast('Listing created successfully!', 'success');
      }
    } catch (e) {
      console.warn("API failed, using mock save", e);
      // Fallback
      let all = JSON.parse(localStorage.getItem('stayez_listings') || '[]');
      if (editingListingId) {
        const idx = all.findIndex(l => l._id === editingListingId);
        if(idx !== -1) all[idx] = { ...all[idx], ...data };
      } else {
        all.push({
          _id: 'list_' + Date.now(),
          hostId: getUser()._id,
          ...data
        });
      }
      localStorage.setItem('stayez_listings', JSON.stringify(all));
      showToast(editingListingId ? 'Updated (Mock)' : 'Created (Mock)', 'success');
    } finally {
      btn.disabled = false;
      closeListingModal();
      loadHostListings();
    }
  }

  function deleteListing(id) {
    showUIConfirm({
      icon: '<i class="fa-solid fa-trash"></i>',
      title: 'Delete Listing',
      body: 'Are you sure you want to delete this listing? All associated bookings will also be deleted.',
      confirmLabel: 'Delete',
      onConfirm: async () => {
        try {
          await apiDeleteListing(id);
          showToast('Listing deleted', 'success');
        } catch (e) {
          console.warn("API failed, using mock delete", e);
          let all = JSON.parse(localStorage.getItem('stayez_listings') || '[]');
          all = all.filter(l => l._id !== id);
          localStorage.setItem('stayez_listings', JSON.stringify(all));
          
          let books = JSON.parse(localStorage.getItem('stayez_bookings') || '[]');
          books = books.filter(b => b.listingId !== id);
          localStorage.setItem('stayez_bookings', JSON.stringify(books));
          showToast('Listing deleted (Mock)', 'success');
        } finally {
          loadHostListings();
         }
        }
    });
  }

  loadHostListings();
</script>

</body>
</html>
