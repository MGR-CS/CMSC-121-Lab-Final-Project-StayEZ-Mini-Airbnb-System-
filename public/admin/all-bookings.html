<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Bookings | Admin StayEZ</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-50">

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>

<div class="page-content container-lg">
  <div style="margin-bottom:32px;">
    <h1 style="font-size:32px;font-weight:800;color:var(--gray-900);margin:0 0 8px;font-family:'DM Serif Display',serif;">All Bookings</h1>
    <p style="color:var(--gray-500);font-size:15px;margin:0;">Monitor all reservation activity</p>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Booking ID</th>
        <th>Listing</th>
        <th>Guest</th>
        <th>Dates</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="admin-bookings-tbody">
      <tr><td colspan="5" style="text-align:center;padding:40px;">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  requireAuth('admin');
  renderHeader('all-bookings');

  async function loadBookings() {
    let bookings = [];
    let listings = [];

    try {
      bookings = await apiGetAllBookings();
      // Only need listings if API doesn't populate it deeply, but we'll fetch just in case
      if (bookings.length > 0 && typeof bookings[0].listingId === 'string') {
        listings = await apiGetListings();
      }
    } catch (e) {
      console.warn("API failed, falling back to mock data", e);
      bookings = JSON.parse(localStorage.getItem('stayez_bookings') || '[]');
      listings = JSON.parse(localStorage.getItem('stayez_listings') || '[]');
    }

    const tbody = document.getElementById('admin-bookings-tbody');
    if (bookings.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No bookings found.</td></tr>';
      return;
    }

    // Sort newest first
    bookings.sort((a,b) => new Date(b.startDate) - new Date(a.startDate));

    tbody.innerHTML = bookings.map(b => {
      let lName = b.listingId?.name;
      if (!lName) {
        const found = listings.find(l => String(l._id) === String(b.listingId));
        lName = found ? found.name : 'Unknown Listing';
      }

      const gName = b.guestId?.name || b.guestName || 'Unknown Guest';
      
      let badge = '';
      if (b.status === 'pending') badge = '<span class="badge badge-pending">Pending</span>';
      else if (b.status === 'approved') badge = '<span class="badge badge-approved">Approved</span>';
      else badge = '<span class="badge badge-rejected">Rejected</span>';

      return `
        <tr>
          <td><span style="font-family:monospace;color:var(--gray-500);">${b._id}</span></td>
          <td><b>${lName}</b></td>
          <td>${gName}</td>
          <td>${new Date(b.startDate).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })} 
          to 
          ${new Date(b.endDate).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })}
          </td>
          <td>
            <p style="font-weight:600;margin:0;color:var(--gray-900);">
              ₱${b.totalPrice ? Number(b.totalPrice).toLocaleString() : '0'}
            </p>
          </td>
          <td>${badge}</td>
        </tr>
      `;
    }).join('');
  }

  loadBookings();
</script>

</body>
</html>
