<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayEZ — Admin: All Bookings</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/admin/manage-listings.html">🏠 StayEZ Admin</a>
    <nav>
      <a href="/admin/manage-listings.html">Listings</a>
      <a href="/admin/all-bookings.html">All Bookings</a>
      <a href="#" id="logout-btn">Logout</a>
    </nav>
  </header>

  <main class="container">
    <h1>All Bookings</h1>
    <div id="bookings-container"><p>Loading...</p></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    requireAuth("admin");
    document.getElementById("logout-btn").addEventListener("click", logout);

    async function loadBookings() {
      try {
        // TODO: GET /api/bookings — admin only, returns all bookings
        const bookings = await apiFetch("/bookings");
        renderBookings(bookings);
      } catch (err) {
        document.getElementById("bookings-container").innerHTML = `<p class="msg-error">${err.message}</p>`;
      }
    }

    function renderBookings(bookings) {
      const container = document.getElementById("bookings-container");
      if (!bookings.length) { container.innerHTML = "<p>No bookings.</p>"; return; }
      // TODO: Render full bookings table with guest, listing, dates, status
      container.innerHTML = `<table>
        <thead><tr><th>Guest</th><th>Listing</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr></thead>
        <tbody>
          ${bookings.map(b => `<tr>
            <td>${b.guestId?.name ?? "—"}</td>
            <td>${b.listingId?.name ?? "—"}</td>
            <td>${new Date(b.startDate).toLocaleDateString()}</td>
            <td>${new Date(b.endDate).toLocaleDateString()}</td>
            <td><span class="badge badge-${b.status}">${b.status}</span></td>
          </tr>`).join("")}
        </tbody></table>`;
    }

    loadBookings();
  </script>
</body>
</html>
