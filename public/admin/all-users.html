<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Users | Admin StayEZ</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-50">

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>

<div class="page-content container-lg">
  <div style="margin-bottom:32px;">
    <h1 style="font-size:32px;font-weight:800;color:var(--gray-900);margin:0 0 8px;font-family:'DM Serif Display',serif;">All Users</h1>
    <p style="color:var(--gray-500);font-size:15px;margin:0;">Manage users registered on the platform</p>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>User ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="admin-users-tbody">
      <tr><td colspan="5" style="text-align:center;padding:40px;">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  requireAuth('admin');
  renderHeader('all-users');

  async function loadUsers() {
    const tbody = document.getElementById('admin-users-tbody');
    let users = [];
    
    try {
      users = await apiGetAllUsers();
    } catch (e) {
      console.warn("Failed to load users from API", e);
    }

    if (!users || users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No users found.</td></tr>';
      return;
    }

    const currentUser = getUser();
    tbody.innerHTML = users.map(u => {
      const isSelf = currentUser && String(currentUser._id) === String(u._id);
      
      let roleSelector = '';
      if (isSelf) {
        let badgeColor = '';
        if (u.role === 'admin') badgeColor = 'background:#EDE9FE;color:#5B21B6;';
        else if (u.role === 'host') badgeColor = 'background:#D1FAE5;color:#065F46;';
        else badgeColor = 'background:#DBEAFE;color:#1D4ED8;';
        roleSelector = `<span class="badge" style="${badgeColor}">${u.role} (You)</span>`;
      } else {
        roleSelector = `
          <select onchange="updateUserRole('${u._id}', this.value)" style="padding:4px 8px; border-radius:6px; border:1px solid var(--gray-200); font-size:12px; font-weight:600; cursor:pointer;">
            <option value="guest" ${u.role === 'guest' ? 'selected' : ''}>Guest</option>
            <option value="host" ${u.role === 'host' ? 'selected' : ''}>Host</option>
            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
          </select>
        `;
      }

      const deleteBtn = isSelf 
        ? `<span style="font-size:12px;color:var(--gray-400);font-style:italic;">N/A</span>`
        : `<button onclick="deleteUser('${u._id}')" class="btn btn-sm" style="background:#FEE2E2;color:#DC2626;"><i class="fas fa-trash"></i> Delete</button>`;

      return `
        <tr>
          <td><span style="font-family:monospace;color:var(--gray-500);">${u._id}</span></td>
          <td><b>${u.name}</b></td>
          <td>${u.email}</td>
          <td>${roleSelector}</td>
          <td style="text-align:right;">${deleteBtn}</td>
        </tr>
      `;
    }).join('');
  }

  async function updateUserRole(userId, newRole) {
    try {
      await apiUpdateUserRole(userId, newRole);
      showToast(`User role updated to '${newRole}' successfully!`, 'success');
      loadUsers();
    } catch (e) {
      showToast(e.message || 'Failed to update user role', 'error');
    }
  }

  function deleteUser(userId) {
    showUIConfirm({
      icon: '<i class="fas fa-user-slash"></i>',
      iconBg: '#FEE2E2',
      title: 'Delete User Account',
      body: 'Are you sure you want to delete this user? Their owned listings and all associated bookings will also be cascade-deleted. This action is permanent.',
      confirmLabel: 'Delete User',
      confirmBg: 'var(--danger)',
      onConfirm: async () => {
        try {
          await apiDeleteUser(userId);
          showToast('User and all related data deleted successfully!', 'success');
          loadUsers();
        } catch (e) {
          showToast(e.message || 'Failed to delete user', 'error');
        }
      }
    });
  }

  loadUsers();
</script>

</body>
</html>
