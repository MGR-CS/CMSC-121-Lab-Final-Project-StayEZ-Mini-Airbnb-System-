<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bookings | StayEZ</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-50">

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>

<div class="page-content container-lg">
  <div style="margin-bottom:32px;">
    <h1 style="font-size:32px;font-weight:800;color:var(--gray-900);margin:0 0 8px;font-family:'DM Serif Display',serif;">My Trips</h1>
    <p style="color:var(--gray-500);font-size:15px;margin:0;">View and manage your upcoming and past reservations</p>
  </div>

  <div id="bookings-container" style="display:flex;flex-direction:column;gap:16px;">
    <!-- Loading skeleton -->
    <div class="card skeleton" style="height:140px;border-radius:16px;"></div>
    <div class="card skeleton" style="height:140px;border-radius:16px;"></div>
  </div>
</div>

<script>
  requireAuth('guest');
  renderHeader('my-bookings');

  async function loadMyBookings() {
    const container = document.getElementById('bookings-container');
    container.innerHTML = '<div class="card skeleton" style="height:140px;border-radius:16px;"></div>'.repeat(3);

    let bookings = [];
    let listingsMap = {};

    try {
      bookings = await apiGetMyBookings();
      // listings populate via api
      bookings.forEach(b => {
        if (b.listingId) {
          listingsMap[b.listingId._id || b.listingId] = b.listingId;
        }
      });
    } catch (e) {
      console.warn("API failed, falling back to mock data", e);
      bookings = JSON.parse(localStorage.getItem('stayez_bookings') || '[]')
        .filter(b => b.guestId === getUser()._id);
      
      const allListings = JSON.parse(localStorage.getItem('stayez_listings') || '[]');
      allListings.forEach(l => listingsMap[l._id] = l);
    }

    if (bookings.length === 0) {
      container.innerHTML = `
        <div style="background:white;border-radius:16px;border:1px solid var(--gray-100);padding:60px 24px;text-align:center;">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--gray-50);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
            <i class="fas fa-suitcase-rolling" style="font-size:24px;color:var(--gray-400);"></i>
          </div>
          <h3 style="font-size:18px;font-weight:700;color:var(--gray-900);margin-bottom:8px;">No trips booked... yet!</h3>
          <p style="color:var(--gray-500);font-size:14px;margin-bottom:24px;">Time to dust off your bags and start planning your next adventure.</p>
          <button onclick="window.location.href='/guest/browse.html'" class="btn btn-primary">Start Exploring</button>
        </div>`;
      return;
    }

    // Sort by start date, newest first
    bookings.sort((a,b) => new Date(b.startDate) - new Date(a.startDate));

    container.innerHTML = bookings.map(booking => {
      const listing = listingsMap[booking.listingId._id || booking.listingId] || { name: 'Unknown Listing', location: 'Unknown', image: 'noImage.png' };
      const statusBadge = {
        pending:  '<span class="badge badge-pending"><i class="fas fa-clock"></i> Pending Approval</span>',
        approved: '<span class="badge badge-approved"><i class="fas fa-check"></i> Confirmed</span>',
        rejected: '<span class="badge badge-rejected"><i class="fas fa-times"></i> Rejected</span>'
      }[booking.status];
      
      const nights = Math.ceil((new Date(booking.endDate) - new Date(booking.startDate)) / (1000*60*60*24));

      return `
        <div style="background:white;border-radius:16px;border:1px solid var(--gray-100);display:flex;overflow:hidden;transition:box-shadow 0.2s;">
          <img src="${listing.image}" style="width:200px;object-fit:cover;flex-shrink:0;" onerror="this.src='noImage.png'"/>
          <div style="padding:24px;flex:1;display:flex;flex-direction:column;justify-content:space-between;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <h3 style="font-size:18px;font-weight:700;color:var(--gray-900);margin:0 0 6px;">${listing.name}</h3>
                <p style="font-size:14px;color:var(--gray-500);margin:0 0 16px;"><i class="fas fa-map-marker-alt" style="margin-right:4px;"></i>${listing.location}</p>
              </div>
              ${statusBadge}
            </div>
            
            <div style="display:flex;justify-content:space-between;align-items:flex-end;">
              <div style="display:flex;gap:32px;">
                <div>
                  <p style="font-size:12px;color:var(--gray-500);text-transform:uppercase;font-weight:700;margin:0 0 4px;">Total</p>
                  <p style="font-weight:600;margin:0;color:var(--gray-900);">₱${booking.totalPrice ? Number(booking.totalPrice).toLocaleString() : '0'}</p>
                  <p style="font-size:12px;color:var(--gray-500);text-transform:uppercase;font-weight:700;margin:0 0 4px;">Dates</p>
                  <p style="font-size:14px;font-weight:600;color:var(--gray-900);margin:0;">${new Date(booking.startDate).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })} → 
                    ${new Date(booking.endDate).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })}
                  </p>
                </div>
                ${booking.status === 'approved' && listing.contactNumber ? `
                <div>
                  <p style="font-size:12px;color:var(--gray-500);text-transform:uppercase;font-weight:700;margin:0 0 4px;">Host Contact</p>
                  <p style="font-size:14px;font-weight:600;color:var(--brand);margin:0;"><i class="fas fa-phone-alt" style="margin-right:6px;"></i>${listing.contactNumber}</p>
                </div>` : ''}
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  loadMyBookings();
</script>

</body>
</html>
