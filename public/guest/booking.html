<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayEZ — Book a Listing</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/guest/browse.html">🏠 StayEZ</a>
    <nav>
      <a href="/guest/browse.html">Browse</a>
      <a href="/guest/my-bookings.html">My Bookings</a>
      <a href="#" id="logout-btn">Logout</a>
    </nav>
  </header>

  <main class="container">
    <h1>Book a Listing</h1>

    <!-- Listing details (populated by JS from URL param ?id=) -->
    <div id="listing-detail" class="card">
      <p>Loading listing...</p>
    </div>

    <!-- Booking form -->
    <div class="card">
      <h2>Select Dates</h2>
      <form id="booking-form">
        <div class="form-group">
          <label for="start-date">Check-in Date</label>
          <input id="start-date" type="date" required />
        </div>
        <div class="form-group">
          <label for="end-date">Check-out Date</label>
          <input id="end-date" type="date" required />
        </div>
        <button type="submit" class="btn btn-primary">Confirm Booking</button>
        <p id="booking-error"   class="msg-error"   hidden></p>
        <p id="booking-success" class="msg-success" hidden></p>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    requireAuth("guest");
    document.getElementById("logout-btn").addEventListener("click", logout);

    // Get listing ID from URL query string
    const params    = new URLSearchParams(window.location.search);
    const listingId = params.get("id");

    if (!listingId) {
      window.location.href = "/guest/browse.html";
    }

    /**
     * TODO: Fetch GET /api/listings/:id and render listing name, type, location, price, description
     * TODO: Do NOT display contactNumber here — only shown after approved booking
     */
    async function loadListing() {
      try {
        const listing = await apiFetch(`/listings/${listingId}`);
        document.getElementById("listing-detail").innerHTML = `
          <h2>${listing.name}</h2>
          <p>${listing.type} · ${listing.location}</p>
          <p><strong>₱${listing.price}/night</strong></p>
          <p>${listing.description || ""}</p>
        `;
      } catch (err) {
        document.getElementById("listing-detail").innerHTML =
          `<p class="msg-error">${err.message}</p>`;
      }
    }

    /**
     * TODO: On form submit:
     *   1. Validate startDate < endDate
     *   2. Call POST /api/bookings with { listingId, startDate, endDate }
     *   3. Show success or error message
     *   4. On success, optionally redirect to /guest/my-bookings.html
     */
    document.getElementById("booking-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const startDate = document.getElementById("start-date").value;
      const endDate   = document.getElementById("end-date").value;
      const errorEl   = document.getElementById("booking-error");
      const successEl = document.getElementById("booking-success");

      errorEl.hidden = successEl.hidden = true;

      if (new Date(startDate) >= new Date(endDate)) {
        errorEl.textContent = "Check-out must be after check-in.";
        errorEl.hidden = false;
        return;
      }

      try {
        // TODO: Call POST /api/bookings
        await apiFetch("/bookings", {
          method: "POST",
          body: { listingId, startDate, endDate },
        });
        successEl.textContent = "Booking submitted! Status: Pending.";
        successEl.hidden = false;
        // TODO: Optionally redirect after short delay
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      }
    });

    loadListing();
  </script>
</body>
</html>
